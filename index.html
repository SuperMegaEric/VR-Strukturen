<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Moleküle</title>

<!-- A-Frame + Bewegung -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

<script>
AFRAME.registerComponent('billboard', {
  init: function () {
    this.cameraWorldPos = new THREE.Vector3();
    this.selfWorldPos = new THREE.Vector3();
  },

  tick: function () {
    const scene = this.el.sceneEl;
    if (!scene || !scene.camera) return;

    scene.camera.getWorldPosition(this.cameraWorldPos);
    this.el.object3D.getWorldPosition(this.selfWorldPos);

    this.cameraWorldPos.y = this.selfWorldPos.y;
    this.el.object3D.lookAt(this.cameraWorldPos);
  }
});

AFRAME.registerComponent('manipulable', {
  schema: {
    minScale: { type: 'number', default: 0.02 },
    maxScale: { type: 'number', default: 0 }
  },

  init: function () {
    this.activeHands = [];

    // Nur Modell + Hitbox werden rotiert/skaliert, nicht der Text.
    this.bodyEl = this.el.querySelector('.manip-body') || this.el;
    this.scaleObject = this.bodyEl.object3D;

    this.tempHand1 = new THREE.Vector3();
    this.tempHand2 = new THREE.Vector3();
    this.tempObject = new THREE.Vector3();
    this.tempMidpoint = new THREE.Vector3();
    this.tempLocal = new THREE.Vector3();
    this.grabPointLocal = new THREE.Vector3();
    this.rotatedGrabOffset = new THREE.Vector3();
    this.currentScale = new THREE.Vector3();

    this.tempQuat1 = new THREE.Quaternion();
    this.tempQuat2 = new THREE.Quaternion();
    this.tempQuat3 = new THREE.Quaternion();
    this.rotationOffset = new THREE.Quaternion();
    this.desiredWorldQuat = new THREE.Quaternion();
    this.initialBodyWorldQuat = new THREE.Quaternion();

    this.midpointOffsetWorld = new THREE.Vector3();
    this.initialScale = new THREE.Vector3(1, 1, 1);
    this.initialTwoHandDistance = 0.001;
  },

  startGrab: function (handEl) {
    if (this.activeHands.indexOf(handEl) !== -1) return;
    if (this.activeHands.length >= 2) return;

    this.activeHands.push(handEl);

    const handGrabber = handEl.components['hand-grabber'];
    if (handGrabber) {
      handGrabber.grabbing = this.el;
    }

    if (this.activeHands.length === 1) {
      this.setupSingleHandState(handEl);
      return;
    }

    if (this.activeHands.length === 2) {
      this.activeHands[0].object3D.getWorldPosition(this.tempHand1);
      this.activeHands[1].object3D.getWorldPosition(this.tempHand2);
      this.el.object3D.getWorldPosition(this.tempObject);
      this.bodyEl.object3D.getWorldQuaternion(this.initialBodyWorldQuat);

      this.initialTwoHandDistance = Math.max(this.tempHand1.distanceTo(this.tempHand2), 0.001);
      this.initialScale.copy(this.scaleObject.scale);

      this.tempMidpoint.copy(this.tempHand1).add(this.tempHand2).multiplyScalar(0.5);
      this.midpointOffsetWorld.copy(this.tempObject).sub(this.tempMidpoint);
    }
  },

  endGrab: function (handEl) {
    const index = this.activeHands.indexOf(handEl);
    if (index === -1) return;

    this.activeHands.splice(index, 1);

    const handGrabber = handEl.components['hand-grabber'];
    if (handGrabber && handGrabber.grabbing === this.el) {
      handGrabber.grabbing = null;
    }

    if (this.activeHands.length === 1) {
      this.setupSingleHandState(this.activeHands[0]);
    }
  },

  setupSingleHandState: function (handEl) {
    handEl.object3D.getWorldQuaternion(this.tempQuat1);
    this.bodyEl.object3D.getWorldQuaternion(this.tempQuat2);

    // relative Drehung zwischen Hand und Objekt merken.
    this.rotationOffset.copy(this.tempQuat1).invert().multiply(this.tempQuat2);

    // Greifpunkt auf dem Objekt merken, damit sich das Modell anfühlt,
    // als würde man wirklich an einem Punkt / „Atom" anfassen.
    handEl.object3D.getWorldPosition(this.tempHand1);
    this.grabPointLocal.copy(this.tempHand1);
    this.bodyEl.object3D.worldToLocal(this.grabPointLocal);
  },

  tick: function () {
    if (this.activeHands.length === 0) return;

    if (this.activeHands.length === 1) {
      this.updateSingleHand();
      return;
    }

    if (this.activeHands.length === 2) {
      this.updateTwoHand();
    }
  },

  updateSingleHand: function () {
    const handEl = this.activeHands[0];
    handEl.object3D.getWorldPosition(this.tempHand1);
    handEl.object3D.getWorldQuaternion(this.tempQuat1);

    // Objektrotation folgt frei der Hand-/Controller-Ausrichtung.
    this.desiredWorldQuat.copy(this.tempQuat1).multiply(this.rotationOffset);
    this.setBodyWorldQuaternion(this.desiredWorldQuat);

    // Das gegriffene lokale Punktstück soll in der Hand bleiben.
    this.currentScale.copy(this.scaleObject.scale);
    this.rotatedGrabOffset.copy(this.grabPointLocal).multiply(this.currentScale).applyQuaternion(this.desiredWorldQuat);
    this.tempObject.copy(this.tempHand1).sub(this.rotatedGrabOffset);
    this.setWorldPosition(this.tempObject);
  },

  updateTwoHand: function () {
    this.activeHands[0].object3D.getWorldPosition(this.tempHand1);
    this.activeHands[1].object3D.getWorldPosition(this.tempHand2);

    const currentDistance = Math.max(this.tempHand1.distanceTo(this.tempHand2), 0.001);
    let desiredScale = this.initialScale.x * (currentDistance / this.initialTwoHandDistance);

    // Kein oberes Limit, wenn maxScale <= 0.
    desiredScale = Math.max(desiredScale, this.data.minScale);
    if (this.data.maxScale > 0) {
      desiredScale = Math.min(desiredScale, this.data.maxScale);
    }

    this.scaleObject.scale.set(desiredScale, desiredScale, desiredScale);

    // Mittelpunkt der beiden Hände folgt dem Objektzentrum.
    this.tempMidpoint.copy(this.tempHand1).add(this.tempHand2).multiplyScalar(0.5);
    this.tempObject.copy(this.tempMidpoint).add(this.midpointOffsetWorld);
    this.setWorldPosition(this.tempObject);

    // Während Zwei-Hand-Griff bleibt die aktuelle Rotation erhalten.
    this.setBodyWorldQuaternion(this.initialBodyWorldQuat);
  },

  setBodyWorldQuaternion: function (worldQuat) {
    const parent = this.bodyEl.object3D.parent;
    if (!parent) {
      this.bodyEl.object3D.quaternion.copy(worldQuat);
      return;
    }

    parent.getWorldQuaternion(this.tempQuat3);
    this.tempQuat3.invert();
    this.bodyEl.object3D.quaternion.copy(this.tempQuat3.multiply(worldQuat));
  },

  setWorldPosition: function (worldPosition) {
    const parent = this.el.object3D.parent;
    if (!parent) {
      this.el.object3D.position.copy(worldPosition);
      return;
    }

    this.tempLocal.copy(worldPosition);
    parent.worldToLocal(this.tempLocal);
    this.el.object3D.position.copy(this.tempLocal);
  }
});

AFRAME.registerComponent('hand-grabber', {
  schema: {
    hand: { type: 'string', default: 'left' },
    handRadius: { type: 'number', default: 0.23 },
    grabEvents: { type: 'string', default: 'gripdown,triggerdown,pinchstarted' },
    releaseEvents: { type: 'string', default: 'gripup,triggerup,pinchended' }
  },

  init: function () {
    this.grabbing = null;

    this.worldHandPos = new THREE.Vector3();
    this.closestPoint = new THREE.Vector3();
    this.bounds = new THREE.Box3();

    this.onGrabStart = this.onGrabStart.bind(this);
    this.onGrabEnd = this.onGrabEnd.bind(this);

    this.grabEventList = this.data.grabEvents
      .split(',')
      .map(function (name) { return name.trim(); })
      .filter(Boolean);

    this.releaseEventList = this.data.releaseEvents
      .split(',')
      .map(function (name) { return name.trim(); })
      .filter(Boolean);

    this.grabEventList.forEach((eventName) => {
      this.el.addEventListener(eventName, this.onGrabStart);
    });

    this.releaseEventList.forEach((eventName) => {
      this.el.addEventListener(eventName, this.onGrabEnd);
    });
  },

  remove: function () {
    this.grabEventList.forEach((eventName) => {
      this.el.removeEventListener(eventName, this.onGrabStart);
    });

    this.releaseEventList.forEach((eventName) => {
      this.el.removeEventListener(eventName, this.onGrabEnd);
    });
  },

  onGrabStart: function () {
    if (this.grabbing) return;

    const target = this.findClosestTarget();
    if (!target) return;

    const manip = target.components.manipulable;
    if (!manip) return;

    manip.startGrab(this.el);
  },

  onGrabEnd: function () {
    if (!this.grabbing) return;

    const manip = this.grabbing.components.manipulable;
    if (manip) {
      manip.endGrab(this.el);
    } else {
      this.grabbing = null;
    }
  },

  findClosestTarget: function () {
    const candidates = this.el.sceneEl.querySelectorAll('.interactable');
    this.el.object3D.getWorldPosition(this.worldHandPos);

    let bestTarget = null;
    let bestDistance = Infinity;

    for (let i = 0; i < candidates.length; i++) {
      const candidate = candidates[i];
      const hitbox = candidate.querySelector('.hitbox') || candidate;
      if (!hitbox || !hitbox.object3D) continue;

      this.bounds.setFromObject(hitbox.object3D);
      this.closestPoint.copy(this.worldHandPos).clamp(this.bounds.min, this.bounds.max);

      const distance = this.worldHandPos.distanceTo(this.closestPoint);
      if (distance <= this.data.handRadius && distance < bestDistance) {
        bestTarget = candidate;
        bestDistance = distance;
      }
    }

    return bestTarget;
  }
});
</script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
</style>
</head>
<body>

<a-scene
  background="color: #cfeaff"
  renderer="colorManagement: true; antialias: true"
  vr-mode-ui="enabled: true">

<!-- Himmel -->
<a-sky color="#87CEEB"></a-sky>

<!-- Assets -->
<a-assets>
  <a-asset-item id="diamant" src="Diamant.glb"></a-asset-item>
  <a-asset-item id="graphit" src="Graphit.glb"></a-asset-item>
  <a-asset-item id="eis" src="Eis2.glb"></a-asset-item>
  <a-asset-item id="mgcl2" src="MgCl2.glb"></a-asset-item>
  <a-asset-item id="imidazol" src="Imidazol.glb"></a-asset-item>
  <a-asset-item id="bodipy" src="BODIPY.glb"></a-asset-item>
  <canvas id="gridCanvas" width="128" height="128"></canvas>
</a-assets>

<!-- Spieler mit Hand-Steuerung -->
<a-entity id="rig" movement-controls="speed: 0.2">
  <a-entity id="camera" camera position="0 1.6 0" look-controls>
    <a-cursor rayOrigin="mouse" fuse="false" material="color: #333333"></a-cursor>
  </a-entity>

  <a-entity
    id="leftHand"
    hand-controls="hand: left; handModelStyle: lowPoly; color: #335CFF"
    hand-grabber="hand: left; handRadius: 0.23; grabEvents: gripdown,triggerdown,pinchstarted; releaseEvents: gripup,triggerup,pinchended">
    <a-sphere radius="0.025" color="#335CFF" opacity="0.45"></a-sphere>
  </a-entity>

  <a-entity
    id="rightHand"
    hand-controls="hand: right; handModelStyle: lowPoly; color: #FF4B4B"
    hand-grabber="hand: right; handRadius: 0.23; grabEvents: gripdown,triggerdown,pinchstarted; releaseEvents: gripup,triggerup,pinchended">
    <a-sphere radius="0.025" color="#FF4B4B" opacity="0.45"></a-sphere>
  </a-entity>
</a-entity>

<!-- Boden -->
<a-plane
  position="0 0 0"
  rotation="-90 0 0"
  width="200"
  height="200"
  material="src: #gridCanvas; repeat: 200 200; shader: flat">
</a-plane>

<!-- Kurzanleitung -->
<a-entity position="0 2.3 -2.5">
  <a-plane width="4.6" height="1.45" color="#ffffff" opacity="0.72"></a-plane>
  <a-text
    value="Grip oder Trigger: Modell greifen, bewegen und drehen\nBeide Hände am selben Modell: Größe ändern\nmaxScale: 0 bedeutet: ohne oberes Limit"
    align="center"
    color="#10263d"
    width="4.2"
    position="0 0 0.01">
  </a-text>
</a-entity>

<!-- Diamant -->
<a-entity class="interactable" manipulable="minScale: 0.02; maxScale: 0" position="0 3 -10">
  <a-entity class="manip-body">
    <a-box class="hitbox" width="3" height="3" depth="3" material="transparent: true; opacity: 0.0; depthWrite: false"></a-box>
    <a-entity gltf-model="#diamant" scale="0.6 0.6 0.6"></a-entity>
  </a-entity>
  <a-text value="Diamant" position="0 2 0" align="center" color="black" billboard></a-text>
</a-entity>

<!-- Graphit -->
<a-entity class="interactable" manipulable="minScale: 0.02; maxScale: 0" position="8.66 3 -5">
  <a-entity class="manip-body">
    <a-box class="hitbox" width="3" height="3" depth="3" material="transparent: true; opacity: 0.0; depthWrite: false"></a-box>
    <a-entity gltf-model="#graphit" scale="0.6 0.6 0.6"></a-entity>
  </a-entity>
  <a-text value="Graphit" position="0 2 0" align="center" color="black" billboard></a-text>
</a-entity>

<!-- Eis -->
<a-entity class="interactable" manipulable="minScale: 0.02; maxScale: 0" position="8.66 1 5">
  <a-entity class="manip-body">
    <a-box class="hitbox" width="3" height="3" depth="3" material="transparent: true; opacity: 0.0; depthWrite: false"></a-box>
    <a-entity gltf-model="#eis" scale="50 50 50"></a-entity>
  </a-entity>
  <a-text value="Eis" position="0 2 0" align="center" color="black" billboard></a-text>
</a-entity>

<!-- MgCl2 -->
<a-entity class="interactable" manipulable="minScale: 0.02; maxScale: 0" position="0 3 10">
  <a-entity class="manip-body">
    <a-box class="hitbox" width="3" height="3" depth="3" material="transparent: true; opacity: 0.0; depthWrite: false"></a-box>
    <a-entity gltf-model="#mgcl2" scale="0.6 0.6 0.6"></a-entity>
  </a-entity>
  <a-text value="MgCl2" position="0 2 0" align="center" color="black" billboard></a-text>
</a-entity>

<!-- Imidazol -->
<a-entity class="interactable" manipulable="minScale: 0.02; maxScale: 0" position="-8.66 3 5">
  <a-entity class="manip-body">
    <a-box class="hitbox" width="3" height="3" depth="3" material="transparent: true; opacity: 0.0; depthWrite: false"></a-box>
    <a-entity gltf-model="#imidazol" scale="0.6 0.6 0.6"></a-entity>
  </a-entity>
  <a-text value="Imidazol" position="0 2 0" align="center" color="black" billboard></a-text>
</a-entity>

<!-- BODIPY -->
<a-entity class="interactable" manipulable="minScale: 0.02; maxScale: 0" position="-8.66 3 -5">
  <a-entity class="manip-body">
    <a-box class="hitbox" width="3" height="3" depth="3" material="transparent: true; opacity: 0.0; depthWrite: false"></a-box>
    <a-entity gltf-model="#bodipy" scale="0.5 0.5 0.5"></a-entity>
  </a-entity>
  <a-text value="BODIPY" position="0 2 0" align="center" color="black" billboard></a-text>
</a-entity>

<!-- Licht -->
<a-entity light="type: ambient; intensity: 1.2"></a-entity>
<a-entity light="type: directional; intensity: 1.2" position="5 10 5"></a-entity>
<a-entity light="type: directional; intensity: 0.8" position="-5 10 -5"></a-entity>

</a-scene>

<script>
  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#00FF00';
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, 128, 128);
</script>

</body>
</html>
