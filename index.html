    // ========================================================
    // BILLBOARD
    // Beschriftungen richten sich horizontal zur Kamera aus.
    // ========================================================

    AFRAME.registerComponent('billboard', {
      init: function () {
        this.cameraWorldPos = new THREE.Vector3();
        this.selfWorldPos = new THREE.Vector3();
      },

      tick: function () {
        const scene = this.el.sceneEl;

        if (!scene || !scene.camera) return;

        scene.camera.getWorldPosition(this.cameraWorldPos);
        this.el.object3D.getWorldPosition(this.selfWorldPos);

        this.cameraWorldPos.y = this.selfWorldPos.y;
        this.el.object3D.lookAt(this.cameraWorldPos);
      }
    });


    // ========================================================
    // MODELLMANIPULATION
    //
    // Bedienung wie im bisherigen Code:
    // - Eine Hand: bewegen und drehen.
    // - Zwei Hände: skalieren und gemeinsam bewegen.
    //
    // Nur .manip-body wird gedreht und skaliert.
    // Die Beschriftung bleibt davon unabhängig.
    // ========================================================

    AFRAME.registerComponent('manipulable', {
      schema: {
        minScale: {
          type: 'number',
          default: 0.02
        },
        maxScale: {
          type: 'number',
          default: 0
        }
      },

      init: function () {
        this.activeHands = [];

        this.bodyEl =
          this.el.querySelector('.manip-body') || this.el;

        this.scaleObject = this.bodyEl.object3D;

        this.tempHand1 = new THREE.Vector3();
        this.tempHand2 = new THREE.Vector3();
        this.tempObject = new THREE.Vector3();
        this.tempMidpoint = new THREE.Vector3();
        this.tempLocal = new THREE.Vector3();

        this.grabPointLocal = new THREE.Vector3();
        this.rotatedGrabOffset = new THREE.Vector3();
        this.currentScale = new THREE.Vector3();

        this.tempQuat1 = new THREE.Quaternion();
        this.tempQuat2 = new THREE.Quaternion();
        this.tempQuat3 = new THREE.Quaternion();

        this.rotationOffset = new THREE.Quaternion();
        this.desiredWorldQuat = new THREE.Quaternion();
        this.initialBodyWorldQuat = new THREE.Quaternion();

        this.midpointOffsetWorld = new THREE.Vector3();
        this.initialScale = new THREE.Vector3(1, 1, 1);
        this.initialTwoHandDistance = 0.001;
      },

      startGrab: function (handEl) {
        if (this.activeHands.indexOf(handEl) !== -1) return;
        if (this.activeHands.length >= 2) return;

        this.activeHands.push(handEl);

        const grabber = handEl.components['hand-grabber'];

        if (grabber) {
          grabber.grabbing = this.el;
        }

        if (this.activeHands.length === 1) {
          this.setupSingleHandState(handEl);
          return;
        }

        if (this.activeHands.length === 2) {
          this.activeHands[0].object3D.getWorldPosition(
            this.tempHand1
          );

          this.activeHands[1].object3D.getWorldPosition(
            this.tempHand2
          );

          this.el.object3D.getWorldPosition(this.tempObject);

          this.bodyEl.object3D.getWorldQuaternion(
            this.initialBodyWorldQuat
          );

          this.initialTwoHandDistance = Math.max(
            this.tempHand1.distanceTo(this.tempHand2),
            0.001
          );

          this.initialScale.copy(this.scaleObject.scale);

          this.tempMidpoint
            .copy(this.tempHand1)
            .add(this.tempHand2)
            .multiplyScalar(0.5);

          this.midpointOffsetWorld
            .copy(this.tempObject)
            .sub(this.tempMidpoint);
        }
      },

      endGrab: function (handEl) {
        const index = this.activeHands.indexOf(handEl);

        if (index === -1) return;

        this.activeHands.splice(index, 1);

        const grabber = handEl.components['hand-grabber'];

        if (grabber && grabber.grabbing === this.el) {
          grabber.grabbing = null;
        }

        if (this.activeHands.length === 1) {
          this.setupSingleHandState(this.activeHands[0]);
        }
      },

      setupSingleHandState: function (handEl) {
        handEl.object3D.getWorldQuaternion(this.tempQuat1);

        this.bodyEl.object3D.getWorldQuaternion(
          this.tempQuat2
        );

        // Relative Drehung zwischen Hand und Modell merken.
        this.rotationOffset
          .copy(this.tempQuat1)
          .invert()
          .multiply(this.tempQuat2);

        // Greifpunkt im lokalen Koordinatensystem merken.
        handEl.object3D.getWorldPosition(this.tempHand1);

        this.grabPointLocal.copy(this.tempHand1);

        this.bodyEl.object3D.worldToLocal(
          this.grabPointLocal
        );
      },

      tick: function () {
        if (this.activeHands.length === 0) return;

        if (this.activeHands.length === 1) {
          this.updateSingleHand();
          return;
        }

        if (this.activeHands.length === 2) {
          this.updateTwoHand();
        }
      },

      updateSingleHand: function () {
        const handEl = this.activeHands[0];

        handEl.object3D.getWorldPosition(this.tempHand1);
        handEl.object3D.getWorldQuaternion(this.tempQuat1);

        this.desiredWorldQuat
          .copy(this.tempQuat1)
          .multiply(this.rotationOffset);

        this.setBodyWorldQuaternion(
          this.desiredWorldQuat
        );

        this.currentScale.copy(this.scaleObject.scale);

        this.rotatedGrabOffset
          .copy(this.grabPointLocal)
          .multiply(this.currentScale)
          .applyQuaternion(this.desiredWorldQuat);

        this.tempObject
          .copy(this.tempHand1)
          .sub(this.rotatedGrabOffset);

        this.setWorldPosition(this.tempObject);
      },

      updateTwoHand: function () {
        this.activeHands[0].object3D.getWorldPosition(
          this.tempHand1
        );

        this.activeHands[1].object3D.getWorldPosition(
          this.tempHand2
        );

        const currentDistance = Math.max(
          this.tempHand1.distanceTo(this.tempHand2),
          0.001
        );

        let desiredScale =
          this.initialScale.x *
          (currentDistance / this.initialTwoHandDistance);

        desiredScale = Math.max(
          desiredScale,
          this.data.minScale
        );

        // maxScale: 0 bedeutet keine Obergrenze.
        if (this.data.maxScale > 0) {
          desiredScale = Math.min(
            desiredScale,
            this.data.maxScale
          );
        }

        this.scaleObject.scale.set(
          desiredScale,
          desiredScale,
          desiredScale
        );

        this.tempMidpoint
          .copy(this.tempHand1)
          .add(this.tempHand2)
          .multiplyScalar(0.5);

        this.tempObject
          .copy(this.tempMidpoint)
          .add(this.midpointOffsetWorld);

        this.setWorldPosition(this.tempObject);

        // Während des Zweihand-Skalierens bleibt die Drehung
        // wie im bisherigen Code erhalten.
        this.setBodyWorldQuaternion(
          this.initialBodyWorldQuat
        );
      },

      setBodyWorldQuaternion: function (worldQuat) {
        const parent = this.bodyEl.object3D.parent;

        if (!parent) {
          this.bodyEl.object3D.quaternion.copy(worldQuat);
          return;
        }

        parent.getWorldQuaternion(this.tempQuat3);
        this.tempQuat3.invert();

        this.bodyEl.object3D.quaternion.copy(
          this.tempQuat3.multiply(worldQuat)
        );
      },

      setWorldPosition: function (worldPosition) {
        const parent = this.el.object3D.parent;

        if (!parent) {
          this.el.object3D.position.copy(worldPosition);
          return;
        }

        this.tempLocal.copy(worldPosition);
        parent.worldToLocal(this.tempLocal);

        this.el.object3D.position.copy(this.tempLocal);
      }
    });


    // ========================================================
    // HAND-GRABBER
    // Greifen über die Nähe der Hand zur Modell-Hitbox.
    // ========================================================

    AFRAME.registerComponent('hand-grabber', {
      schema: {
        hand: {
          type: 'string',
          default: 'left'
        },
        handRadius: {
          type: 'number',
          default: 0.23
        },
        grabEvents: {
          type: 'string',
          default: 'gripdown,triggerdown,pinchstarted'
        },
        releaseEvents: {
          type: 'string',
          default: 'gripup,triggerup,pinchended'
        }
      },

      init: function () {
        this.grabbing = null;

        this.worldHandPos = new THREE.Vector3();
        this.closestPoint = new THREE.Vector3();
        this.bounds = new THREE.Box3();

        this.onGrabStart = this.onGrabStart.bind(this);
        this.onGrabEnd = this.onGrabEnd.bind(this);

        this.grabEventList = this.data.grabEvents
          .split(',')
          .map(name => name.trim())
          .filter(Boolean);

        this.releaseEventList = this.data.releaseEvents
          .split(',')
          .map(name => name.trim())
          .filter(Boolean);

        this.grabEventList.forEach(eventName => {
          this.el.addEventListener(
            eventName,
            this.onGrabStart
          );
        });

        this.releaseEventList.forEach(eventName => {
          this.el.addEventListener(
            eventName,
            this.onGrabEnd
          );
        });

        // Ein getrenntes Headset/Controller-Gerät soll
        // kein Modell dauerhaft festhalten.
        this.el.addEventListener(
          'controllerdisconnected',
          this.onGrabEnd
        );
      },

      remove: function () {
        this.onGrabEnd();

        this.grabEventList.forEach(eventName => {
          this.el.removeEventListener(
            eventName,
            this.onGrabStart
          );
        });

        this.releaseEventList.forEach(eventName => {
          this.el.removeEventListener(
            eventName,
            this.onGrabEnd
          );
        });

        this.el.removeEventListener(
          'controllerdisconnected',
          this.onGrabEnd
        );
      },

      onGrabStart: function () {
        if (this.grabbing) return;

        const target = this.findClosestTarget();

        if (!target) return;

        const manip = target.components.manipulable;

        if (!manip) return;

        manip.startGrab(this.el);
      },

      onGrabEnd: function () {
        if (!this.grabbing) return;

        const manip = this.grabbing.components.manipulable;

        if (manip) {
          manip.endGrab(this.el);
        } else {
          this.grabbing = null;
        }
      },

      findClosestTarget: function () {
        const candidates =
          this.el.sceneEl.querySelectorAll('.interactable');

        this.el.object3D.getWorldPosition(
          this.worldHandPos
        );

        let bestTarget = null;
        let bestDistance = Infinity;

        for (let i = 0; i < candidates.length; i++) {
          const candidate = candidates[i];

          const hitbox =
            candidate.querySelector('.hitbox') || candidate;

          if (!hitbox || !hitbox.object3D) continue;

          this.bounds.setFromObject(hitbox.object3D);

          if (this.bounds.isEmpty()) continue;

          this.closestPoint
            .copy(this.worldHandPos)
            .clamp(this.bounds.min, this.bounds.max);

          const distance = this.worldHandPos.distanceTo(
            this.closestPoint
          );

          if (
            distance <= this.data.handRadius &&
            distance < bestDistance
          ) {
            bestTarget = candidate;
            bestDistance = distance;
          }
        }

        return bestTarget;
      }
    });


    // ========================================================
    // HALLENBAUER
    // Erzeugt die komplette Halle und alle 16 Stationen.
    // ========================================================

    AFRAME.registerComponent('chemistry-hall', {
      init: function () {
        this.cfg = HALL_CONFIG;

        this.buildFloor();
        this.buildCeiling();
        this.buildWalls();
        this.buildDoor();
        this.buildLights();
        this.buildStations();
      },

      make: function (tag, attributes, parent) {
        const element = document.createElement(tag);

        Object.entries(attributes || {}).forEach(
          ([name, value]) => {
            element.setAttribute(name, value);
          }
        );

        (parent || this.el).appendChild(element);

        return element;
      },

      box: function (
        position,
        width,
        height,
        depth,
        material,
        parent
      ) {
        return this.make('a-box', {
          position: position.join(' '),
          width: width,
          height: height,
          depth: depth,
          material: material
        }, parent);
      },

      // ------------------------------------------------------
      // BODEN UND SPIELFELDMARKIERUNGEN
      // ------------------------------------------------------

     buildFloor: function () {
  const c = this.cfg;

  this.make('a-plane', {
    id: 'hallFloor',
    position: '0 0 0',
    rotation: '-90 0 0',
    width: c.width,
    height: c.depth,
    material: c.materials.floor
  });

  const lineMaterial = {
    shader: 'flat',
    color: '#ffffff'
  };

  const line = (x, z, width, height) => {
    this.make('a-plane', {
      position: `${x} 0.015 ${z}`,
      rotation: '-90 0 0',
      width: width,
      height: height,
      material: lineMaterial
    });
  };

  // Verkleinertes Spielfeld
  line(0, -9, 26, 0.07);
  line(0, 9, 26, 0.07);
  line(-13, 0, 0.07, 18);
  line(13, 0, 0.07, 18);
  line(0, 0, 0.07, 18);

  this.make('a-ring', {
    position: '0 0.016 0',
    rotation: '-90 0 0',
    'radius-inner': 2.6,
    'radius-outer': 2.68,
    material: lineMaterial
  });
},


      // ------------------------------------------------------
      // DECKE UND TRÄGER
      // ------------------------------------------------------

      buildCeiling: function () {
        const c = this.cfg;

        this.make('a-box', {
          id: 'hallCeiling',
          position: `0 ${c.height + 0.1} 0`,
          width: c.width,
          height: 0.2,
          depth: c.depth,
          material: c.materials.ceiling
        });

        [-10, 0, 10].forEach(x => {
          this.box(
            [x, c.height - 0.2, 0],
            0.22,
            0.35,
            c.depth,
            {
              color: '#9b9b96',
              roughness: 0.8,
              metalness: 0.15
            }
          );
        });
      },

      // ------------------------------------------------------
      // VIER WÄNDE MIT ECHTEN ÖFFNUNGEN
      // ------------------------------------------------------

      buildWalls: function () {
        const c = this.cfg;

        // Fenster liegen oberhalb der Poster.
        const windowBottom = 5.7;
        const windowTop = 6.9;
        const windowWidth = 3.2;

        const windowsAt = centers => centers.map(center => ({
          left: center - windowWidth / 2,
          right: center + windowWidth / 2,
          bottom: windowBottom,
          top: windowTop,
          type: 'window'
        }));

        this.buildWall(
          'wallLeft',
          [-c.width / 2, 0, 0],
          90,
          c.depth,
          windowsAt([-7, 0, 7])
        );

        this.buildWall(
          'wallRight',
          [c.width / 2, 0, 0],
          -90,
          c.depth,
          windowsAt([-7, 0, 7])
        );

        this.buildWall(
          'wallBack',
          [0, 0, c.depth / 2],
          180,
          c.width,
          windowsAt([-10, 10])
        );

        this.buildWall(
          'wallFront',
          [0, 0, -c.depth / 2],
          0,
          c.width,
          [
            ...windowsAt([-10, 10]),
            {
              left: -2.1,
              right: 2.1,
              bottom: 0,
              top: 3.2,
              type: 'door'
            }
          ]
        );
      },

      buildWall: function (
        id,
        position,
        yaw,
        length,
        openings
      ) {
        const c = this.cfg;

        const group = this.make('a-entity', {
          id: id,
          position: position.join(' '),
          rotation: `0 ${yaw} 0`
        });

        // Die Wand wird in horizontale Höhenbereiche zerlegt.
        const levels = [...new Set([
          0,
          c.height,
          ...openings.flatMap(o => [o.bottom, o.top])
        ])].sort((a, b) => a - b);

        for (let row = 0; row < levels.length - 1; row++) {
          const bottom = levels[row];
          const top = levels[row + 1];
          const middleY = (bottom + top) / 2;

          const activeOpenings = openings
            .filter(o =>
              middleY > o.bottom &&
              middleY < o.top
            )
            .sort((a, b) => a.left - b.left);

          let cursor = -length / 2;

          const addSection = (left, right) => {
            if (right <= left) return;

            this.box(
              [(left + right) / 2, middleY, 0],
              right - left,
              top - bottom,
              c.wallThickness,
              c.materials.wall,
              group
            );
          };

          activeOpenings.forEach(opening => {
            addSection(cursor, opening.left);
            cursor = opening.right;
          });

          addSection(cursor, length / 2);
        }

        openings
          .filter(o => o.type === 'window')
          .forEach(o => this.buildWindow(o, group));
      },

      // ------------------------------------------------------
      // FENSTERGLAS UND RAHMEN
      // ------------------------------------------------------

      buildWindow: function (opening, parent) {
        const c = this.cfg;

        const width = opening.right - opening.left;
        const height = opening.top - opening.bottom;
        const x = (opening.left + opening.right) / 2;
        const y = (opening.bottom + opening.top) / 2;

        const frameMaterial = {
          color: '#e9e9e4',
          roughness: 0.65,
          metalness: 0.1
        };

        this.make('a-plane', {
          position: `${x} ${y} 0`,
          width: width,
          height: height,
          material: {
            color: '#bde5ff',
            transparent: true,
            opacity: 0.22,
            side: 'double',
            roughness: 0.15,
            metalness: 0,
            depthWrite: false
          }
        }, parent);

        // Seitliche Rahmen
        [opening.left, opening.right].forEach(edgeX => {
          this.box(
            [edgeX, y, 0],
            0.10,
            height + 0.10,
            c.wallThickness + 0.06,
            frameMaterial,
            parent
          );
        });

        // Obere und untere Rahmen
        [opening.bottom, opening.top].forEach(edgeY => {
          this.box(
            [x, edgeY, 0],
            width + 0.10,
            0.10,
            c.wallThickness + 0.06,
            frameMaterial,
            parent
          );
        });

        // Mittlere Sprosse
        this.box(
          [x, y, 0],
          0.07,
          height,
          0.08,
          frameMaterial,
          parent
        );
      },

      // ------------------------------------------------------
      // EINGANGSTÜR
      // ------------------------------------------------------

      buildDoor: function () {
        const z = -this.cfg.depth / 2;

        const frameMaterial = {
          color: '#6c4d34',
          roughness: 0.85,
          metalness: 0
        };

        this.box(
          [-2.1, 1.6, z],
          0.14, 3.2, 0.36,
          frameMaterial
        );

        this.box(
          [2.1, 1.6, z],
          0.14, 3.2, 0.36,
          frameMaterial
        );

        this.box(
          [0, 3.2, z],
          4.34, 0.14, 0.36,
          frameMaterial
        );

        // Türblatt mit seitlichem Scharnierpunkt.
        // Der Öffnungswinkel kann hier geändert werden.
        const hinge = this.make('a-entity', {
          id: 'entranceDoor',
          position: `-2.03 0 ${z + 0.08}`,
          rotation: '0 -70 0'
        });

        this.box(
          [2.03, 1.56, 0],
          4.06,
          3.12,
          0.10,
          {
            color: '#7f5a3d',
            roughness: 0.8,
            metalness: 0
          },
          hinge
        );

        // Türgriff
        this.box(
          [3.65, 1.3, 0.09],
          0.28,
          0.05,
          0.08,
          {
            color: '#bfc3c6',
            roughness: 0.3,
            metalness: 0.8
          },
          hinge
        );

        // Eingangsschild
        const sign = this.make('a-entity', {
          position: `0 3.65 ${z + 0.22}`
        });

        this.make('a-plane', {
          width: 2.3,
          height: 0.45,
          material: {
            shader: 'flat',
            color: '#237b50'
          }
        }, sign);

        this.make('a-text', {
          value: 'EINGANG',
          align: 'center',
          color: '#ffffff',
          width: 2,
          position: '0 0 0.015'
        }, sign);
      },

      // ------------------------------------------------------
      // DECKENLEUCHTEN UND BELEUCHTUNG
      // ------------------------------------------------------

      buildLights: function () {
        const c = this.cfg;

        // Neun sichtbare Deckenleuchten.
        // +90 Grad lässt die Vorderseite nach unten zeigen.
       [-10, 0, 10].forEach(x => {
         [-7, 0, 7].forEach(z => {
            this.make('a-plane', {
              position: `${x} ${c.height - 0.03} ${z}`,
              rotation: '90 0 0',
              width: 5.2,
              height: 1.2,
              material: {
                shader: 'flat',
                color: '#fff4da'
              }
            });
          });
        });

        // Grundbeleuchtung
        this.make('a-entity', {
          light: {
            type: 'ambient',
            color: '#ffffff',
            intensity: 0.7
          }
        });

        // Gerichtetes Licht für plastische Modelle
        this.make('a-entity', {
          position: '-10 7 5',
          light: {
            type: 'directional',
            color: '#fff4e3',
            intensity: 0.55
          }
        });

        this.make('a-entity', {
          position: '10 7 -5',
          light: {
            type: 'directional',
            color: '#eaf3ff',
            intensity: 0.35
          }
        });

        // Drei zusätzliche Punktlichter.
        // Weniger echte Lichtquellen als sichtbare Leuchten
        // reduziert den Aufwand auf VR-Headsets.
        [-7, 0, 7].forEach(z => {
          this.make('a-entity', {
            position: `0 ${c.height - 0.8} ${z}`,
            light: {
              type: 'point',
              color: '#fff4e3',
              intensity: 0.5,
              distance: 40,
              decay: 1
            }
          });
        });
      },

      // ------------------------------------------------------
      // POSTER UND ZUGEHÖRIGE MODELLE
      // ------------------------------------------------------

      buildStations: function () {
        const c = this.cfg;

        // Kleiner Abstand zur inneren Wandoberfläche,
        // damit Poster und Wand nicht flimmern.
        const inset = c.wallThickness / 2 + 0.06;

        c.stations.forEach((station, index) => {
          const number = String(index + 1).padStart(2, '0');

          let x;
          let z;
          let yaw;
          let nx;
          let nz;

          // nx/nz beschreiben die Richtung in den Raum.
          switch (station.wall) {
            case 'left':
              x = -c.width / 2 + inset;
              z = station.along;
              yaw = 90;
              nx = 1;
              nz = 0;
              break;

            case 'right':
              x = c.width / 2 - inset;
              z = station.along;
              yaw = -90;
              nx = -1;
              nz = 0;
              break;

            case 'back':
              x = station.along;
              z = c.depth / 2 - inset;
              yaw = 180;
              nx = 0;
              nz = -1;
              break;

            case 'front':
              x = station.along;
              z = -c.depth / 2 + inset;
              yaw = 0;
              nx = 0;
              nz = 1;
              break;

            default:
              console.warn(
                'Unbekannte Wand für Station:',
                station
              );
              return;
          }

          // ==================================================
          // POSTER
          // ==================================================

          const poster = this.make('a-entity', {
            id: `poster${number}`,
            position: `${x} ${c.posterCenterY} ${z}`,
            rotation: `0 ${yaw} 0`
          });

          // Dunkler Rahmen
          this.make('a-plane', {
            width: c.posterWidth + 0.18,
            height: c.posterHeight + 0.18,
            material: {
              shader: 'flat',
              color: '#292d32'
            }
          }, poster);

          // Folien sind unbeleuchtet dargestellt:
          // Ihre Farben bleiben unabhängig vom Hallenlicht.
          const slideMaterial = {
            shader: 'flat',
            color: station.slide ? '#ffffff' : '#f6f4ef'
          };

          if (station.slide) {
            slideMaterial.src = station.slide;
          }

          this.make('a-plane', {
            id: `slide${number}`,
            width: c.posterWidth,
            height: c.posterHeight,
            position: '0 0 0.015',
            material: slideMaterial
          }, poster);

          // Platzhaltertext nur ohne eingetragenes Folienbild.
          if (!station.slide) {
            this.make('a-text', {
              value:
                `Poster ${number}\n` +
                `${station.title}\n` +
                '16:9 - Vorlesungsfolie',
              align: 'center',
              color: '#303942',
              width: c.posterWidth - 0.3,
              position: '0 0 0.03'
            }, poster);
          }

          // ==================================================
          // MODELL
          //
          // Das Modell ist kein Kind des Posters.
          // Es lässt sich frei im Raum bewegen.
          // ==================================================

          const modelRoot = this.make('a-entity', {
            id: `model${number}`,
            class: 'interactable',
            position:
              `${x + nx * c.modelWallDistance} ` +
              `${c.modelCenterY} ` +
              `${z + nz * c.modelWallDistance}`
          });

          // Körper für Modell und Greifbox.
          const body = this.make('a-entity', {
            class: 'manip-body'
          }, modelRoot);

          // Die Größen entsprechen näherungsweise den
          // Greifboxen aus deiner bisherigen Umgebung.
          const hitboxSize = station.model
            ? (station.model === '#diamant' ? 2.6 : 2.8)
            : 1.1;

          this.make('a-box', {
            class: 'hitbox',
            width: hitboxSize,
            height: hitboxSize,
            depth: hitboxSize,
            material: {
              transparent: true,
              opacity: 0,
              depthWrite: false
            }
          }, body);

          if (station.model) {
            const scale = station.scale || 1;

            const model = this.make('a-entity', {
              'gltf-model': station.model,
              scale: `${scale} ${scale} ${scale}`
            }, body);

            model.addEventListener('model-error', () => {
              console.warn(
                `Modell an Station ${number} konnte ` +
                'nicht geladen werden:',
                station.model
              );
            });

          } else {
            // Auch die Platzhalter lassen sich greifen,
            // bewegen, drehen und skalieren.
            this.make('a-sphere', {
              radius: 0.45,
              material: {
                color: '#6487a6',
                wireframe: true
              }
            }, body);

            this.make('a-sphere', {
              radius: 0.12,
              material: {
                color: '#e2a35b',
                roughness: 0.5
              }
            }, body);
          }

          // Beschriftung außerhalb von .manip-body:
          // Sie folgt der Position, aber nicht der
          // Drehung oder Skalierung des Modellkörpers.
          this.make('a-text', {
            value: station.model
              ? station.title
              : `Modellplatz ${number}`,
            position: '0 -0.95 0',
            align: 'center',
            color: '#263440',
            width: 2.8,
            billboard: ''
          }, modelRoot);

          // Erst nach Aufbau des Modellkörpers aktivieren.
          // Keine Obergrenze für die Skalierung.
          modelRoot.setAttribute(
            'manipulable',
            'minScale: 0.02; maxScale: 0'
          );
        });
      }
    });
  </script>

  <script>
  // ========================================================
  // AUSSENBEREICH
  // Blauer Himmel wird durch <a-sky> dargestellt.
  // Diese Komponente ergänzt Boden, Weg, Bäume und Wolken.
  // ========================================================

  AFRAME.registerComponent('park-exterior', {
    init: function () {
      this.buildGround();
      this.buildPath();
      this.buildTrees();
      this.buildClouds();
    },

    make: function (tag, attributes, parent) {
      const element = document.createElement(tag);

      Object.entries(attributes || {}).forEach(
        ([name, value]) => {
          element.setAttribute(name, value);
        }
      );

      (parent || this.el).appendChild(element);

      return element;
    },

    buildGround: function () {
      // Liegt etwas unterhalb des Hallenbodens.
      this.make('a-plane', {
        position: '0 -0.04 0',
        rotation: '-90 0 0',
        width: 180,
        height: 180,
        material: {
          color: '#79a95c',
          roughness: 1,
          metalness: 0
        }
      });
    },

    buildPath: function () {
      const doorZ = -HALL_CONFIG.depth / 2;
      const pathLength = 55;

      // Weg beginnt direkt vor der Tür und führt in den Park.
      this.make('a-plane', {
        position: `0 -0.025 ${doorZ - pathLength / 2}`,
        rotation: '-90 0 0',
        width: 4.2,
        height: pathLength,
        material: {
          color: '#c9bea8',
          roughness: 1,
          metalness: 0
        }
      });

      // Helle Einfassungen des Weges
      [-2.18, 2.18].forEach(x => {
        this.make('a-box', {
          position: `${x} -0.005 ${doorZ - pathLength / 2}`,
          width: 0.14,
          height: 0.08,
          depth: pathLength,
          material: {
            color: '#ddd5c5',
            roughness: 1
          }
        });
      });

      // Querweg im Park
      this.make('a-plane', {
        position: '0 -0.02 -34',
        rotation: '-90 0 0',
        width: 46,
        height: 3,
        material: {
          color: '#c9bea8',
          roughness: 1
        }
      });
    },

    buildTrees: function () {
      // Bäume entlang des Eingangsweges und rund um die Halle.
      // Alle Positionen befinden sich außerhalb der Halle.
      const trees = [
        [-7, -18, 1.0],
        [7, -19, 1.1],
        [-10, -26, 1.2],
        [10, -27, 1.0],
        [-8, -40, 1.1],
        [8, -42, 1.2],
        [-13, -51, 1.0],
        [13, -54, 1.1],

        [-23, -8, 1.1],
        [-25, 3, 1.2],
        [-23, 13, 1.0],

        [23, -9, 1.0],
        [25, 2, 1.2],
        [23, 13, 1.1],

        [-12, 23, 1.1],
        [0, 27, 1.2],
        [12, 23, 1.0]
      ];

      trees.forEach(([x, z, size], index) => {
        const tree = this.make('a-entity', {
          position: `${x} 0 ${z}`,
          scale: `${size} ${size} ${size}`
        });

        // Stamm
        this.make('a-cylinder', {
          position: '0 1.7 0',
          radius: 0.23,
          height: 3.4,
          'segments-radial': 8,
          material: {
            color: '#765035',
            roughness: 1
          }
        }, tree);

        // Baumkrone aus mehreren einfachen Formen
        const leafColor = index % 2 === 0
          ? '#3e7b43'
          : '#568b45';

        [
          [0, 4.2, 0, 1.8],
          [-1.0, 3.5, 0.25, 1.25],
          [1.0, 3.6, -0.2, 1.3]
        ].forEach(([cx, cy, cz, radius]) => {
          this.make('a-sphere', {
            position: `${cx} ${cy} ${cz}`,
            radius: radius,
            'segments-width': 10,
            'segments-height': 7,
            material: {
              color: leafColor,
              roughness: 1
            }
          }, tree);
        });
      });
    },

    buildClouds: function () {
      // Wolken außerhalb und oberhalb der Halle.
      // Sie sind durch die hohen Fenster sichtbar.
      const clouds = [
        [-35, 15, -20, 1.1],
        [-40, 16, 5, 1.0],
        [-34, 15, 25, 1.2],

        [35, 15, -22, 1.1],
        [40, 17, 3, 1.3],
        [34, 15, 25, 1.0],

        [-18, 16, 40, 1.2],
        [8, 15, 42, 1.0],

        [-19, 16, -42, 1.2],
        [12, 15, -43, 1.1],
        [0, 20, -62, 1.4]
      ];

      clouds.forEach(([x, y, z, size]) => {
        const cloud = this.make('a-entity', {
          position: `${x} ${y} ${z}`,
          scale: `${size} ${size} ${size}`
        });

        // Überlappende weiße Ellipsoide ergeben eine Wolke.
        [
          [-2.2, 0, 0, 1.9],
          [0, 0.45, 0, 2.3],
          [2.3, 0.05, 0.1, 1.8],
          [0.6, -0.25, 0.8, 1.7]
        ].forEach(([cx, cy, cz, radius]) => {
          this.make('a-sphere', {
            position: `${cx} ${cy} ${cz}`,
            radius: radius,
            scale: '1.3 0.65 1',
            'segments-width': 12,
            'segments-height': 8,
            material: {
              shader: 'flat',
              color: '#ffffff'
            }
          }, cloud);
        });
      });
    }
  });
</script>

</head>

<body>
  <a-scene
    background="color: #b8d7f0"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: true">

    <!-- ==================================================== -->
    <!-- MODELLDATEIEN                                       -->
    <!-- Diese Dateien liegen neben der index.html.          -->
    <!-- ==================================================== -->

    <a-assets timeout="30000">
      <a-asset-item
        id="diamant"
        src="Diamant.glb">
      </a-asset-item>

      <a-asset-item
        id="graphit"
        src="Graphit.glb">
      </a-asset-item>

      <a-asset-item
        id="eis"
        src="Eis2.glb">
      </a-asset-item>

      <a-asset-item
        id="mgcl2"
        src="MgCl2.glb">
      </a-asset-item>

      <a-asset-item
        id="imidazol"
        src="Imidazol.glb">
      </a-asset-item>

      <a-asset-item
        id="bodipy"
        src="BODIPY.glb">
      </a-asset-item>

      <!-- Weitere Modelle kannst du hier ergänzen:
      <a-asset-item
        id="nacl"
        src="NaCl.glb">
      </a-asset-item>
      -->
    </a-assets>

    <!-- Außenhimmel, sichtbar durch Fenster und Eingang -->
   <!-- Blauer Himmel -->
<a-sky color="#88c8f0"></a-sky>

<!-- Park, Weg, Bäume und Wolken außerhalb der Halle -->
<a-entity id="outsidePark" park-exterior></a-entity>

    <!-- ==================================================== -->
    <!-- SPIELER, KAMERA UND CONTROLLER                      -->
    <!-- ==================================================== -->

    <!--
      Die Startposition gehört zum Rig.
      Dadurch sind Kamera und Controller gemeinsam versetzt.

      Bewegung:
      - Am Computer über die movement-controls, z. B. WASD.
      - In VR über unterstützte Controller-Eingaben.
    -->
    <a-entity
      id="rig"
      position="0 0 7.5"
      movement-controls="speed: 0.22">

      <a-entity
        id="camera"
        camera
        position="0 1.6 0"
        look-controls>

        <a-cursor
          rayOrigin="mouse"
          fuse="false"
          material="color: #333333">
        </a-cursor>
      </a-entity>

      <!-- Linker Controller -->
      <a-entity
        id="leftHand"
        hand-controls="hand: left; handModelStyle: lowPoly; color: #335CFF"
        hand-grabber="hand: left; handRadius: 0.23; grabEvents: gripdown,triggerdown,pinchstarted; releaseEvents: gripup,triggerup,pinchended">

        <a-sphere
          radius="0.025"
          color="#335CFF"
          opacity="0.45">
        </a-sphere>
      </a-entity>

      <!-- Rechter Controller -->
      <a-entity
        id="rightHand"
        hand-controls="hand: right; handModelStyle: lowPoly; color: #FF4B4B"
        hand-grabber="hand: right; handRadius: 0.23; grabEvents: gripdown,triggerdown,pinchstarted; releaseEvents: gripup,triggerup,pinchended">

        <a-sphere
          radius="0.025"
          color="#FF4B4B"
          opacity="0.45">
        </a-sphere>
      </a-entity>
    </a-entity>

    <!-- ==================================================== -->
    <!-- DIE HALLE WIRD DURCH DIE KOMPONENTE ERZEUGT          -->
    <!-- ==================================================== -->

    <a-entity
      id="chemistryHall"
      chemistry-hall>
    </a-entity>

    <!-- ==================================================== -->
    <!-- HINWEISTAFEL AM STARTPUNKT                           -->
    <!-- ==================================================== -->

    <a-entity position="0 1.9 4">
      <a-plane
        width="5.4"
        height="1.3"
        material="shader: flat; color: #ffffff">
      </a-plane>

      <a-text
        value="VR-Chemiehalle\nGrip/Trigger: greifen, bewegen und drehen\nZwei Controller: Modell skalieren\n16 Stationen mit Folien und 3D-Modellen"
        align="center"
        color="#10263d"
        width="4.8"
        position="0 0 0.02">
      </a-text>
    </a-entity>

  </a-scene>
</body>
</html>
